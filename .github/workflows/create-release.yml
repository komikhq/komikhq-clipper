name: Build & Release Extension Packs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing release tag to build, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}

jobs:
  build-extensions:
    name: Build Extension Packs & Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set Release Version
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must contain a semver version: $RELEASE_TAG"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG_NAME=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "Building $RELEASE_TAG (version $VERSION)"

      - name: Patch package.json Version
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.env.VERSION;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            console.log('Patched package.json version to:', pkg.version);
          "
          pnpm wxt prepare

      - name: Typecheck
        run: pnpm compile

      - name: Build Extension Packs (WXT)
        run: |
          mkdir -p dist

          # Build Chrome & Firefox extension zips using WXT
          pnpm run zip
          pnpm run zip:firefox

          # Copy WXT zip outputs into dist/
          cp .output/komikhq-clipper-${VERSION}-chrome.zip "dist/komikhq-clipper-${TAG_NAME}-chrome.zip"
          cp .output/komikhq-clipper-${VERSION}-firefox.zip "dist/komikhq-clipper-${TAG_NAME}-firefox.zip"
          cp .output/komikhq-clipper-${VERSION}-sources.zip "dist/komikhq-clipper-${TAG_NAME}-sources.zip"

          echo "Extension zips built"
          ls -lh dist/

      - name: Generate AI Release Notes via Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ env.RELEASE_TAG }}
        run: node .github/scripts/generate-release-notes/index.cjs

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          draft: false
          if-no-files-found: ignore
          prerelease: ${{ contains(env.RELEASE_TAG, 'beta') || contains(env.RELEASE_TAG, 'alpha') || contains(env.RELEASE_TAG, 'rc') }}
          files: |
            dist/komikhq-clipper-${{ env.TAG_NAME }}-chrome.zip
            dist/komikhq-clipper-${{ env.TAG_NAME }}-firefox.zip
            dist/komikhq-clipper-${{ env.TAG_NAME }}-sources.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
