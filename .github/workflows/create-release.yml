name: Build & Release Extension Packs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-extensions:
    name: Build Extension Packs & Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract Version from Tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=$GITHUB_REF_NAME" >> $GITHUB_ENV
          echo "Building version: $VERSION"

      - name: Patch manifest.json Version
        run: |
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            manifest.version = process.env.VERSION;
            fs.writeFileSync('manifest.json', JSON.stringify(manifest, null, 2) + '\n');
            console.log('Patched manifest.json to version:', manifest.version);
          "

      - name: Build Chromium Extension (ZIP)
        run: |
          mkdir -p dist
          zip -r "dist/komikhq-clipper-${TAG_NAME}-chromium.zip" \
            manifest.json \
            assets/ \
            lib/ \
            popup/ \
            service-worker/ \
            content-scripts/ \
            -x "*.pem" "*.md" ".git/*" ".github/*" "dist/*" "node_modules/*" "scripts/*" "keys/*"
          echo "✅ Chromium ZIP built"
          ls -lh dist/

      - name: Build Chromium Extension (CRX3 Self-Signed)
        run: |
          # Decode PEM key from secret
          echo "${{ secrets.EXTENSION_PEM_KEY }}" > /tmp/extension.pem

          # Install crx3 CLI
          npm install -g crx3

          # Create a clean build directory (crx3 packs entire directory)
          mkdir -p /tmp/crx-build
          cp -r manifest.json assets/ lib/ popup/ service-worker/ content-scripts/ /tmp/crx-build/

          # Pack CRX3 with the private key
          crx3 pack /tmp/crx-build \
            -p /tmp/extension.pem \
            -o "dist/komikhq-clipper-${TAG_NAME}.crx"

          # Cleanup
          rm -f /tmp/extension.pem
          rm -rf /tmp/crx-build
          echo "✅ CRX3 built with consistent Extension ID"
          ls -lh dist/

      - name: Build Firefox Extension (XPI)
        run: |
          # Create a temporary directory for Firefox build
          mkdir -p /tmp/firefox-build
          cp -r manifest.json assets/ lib/ popup/ service-worker/ content-scripts/ /tmp/firefox-build/

          # Patch manifest for Firefox compatibility
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('/tmp/firefox-build/manifest.json', 'utf8'));

            // Add Firefox-specific settings
            manifest.browser_specific_settings = {
              gecko: {
                id: 'clipper@komikhq.org',
                strict_min_version: '109.0',
                data_collection_permissions: {
                  required: ['none']
                }
              }
            };

            // Firefox MV3 uses 'background.scripts' instead of 'service_worker'
            if (manifest.background && manifest.background.service_worker) {
              manifest.background = {
                scripts: [manifest.background.service_worker]
              };
            }

            fs.writeFileSync('/tmp/firefox-build/manifest.json', JSON.stringify(manifest, null, 2) + '\n');
            console.log('Patched manifest for Firefox');
          "

          # Create XPI (ZIP with .xpi extension)
          cd /tmp/firefox-build
          zip -r "${GITHUB_WORKSPACE}/dist/komikhq-clipper-${TAG_NAME}-firefox.xpi" .
          echo "✅ Firefox XPI built"
          ls -lh ${GITHUB_WORKSPACE}/dist/

      - name: Skip AMO signing until AMO add-on exists
        if: ${{ vars.AMO_ADDON_ID == '' }}
        run: |
          echo "Skipping AMO signing because AMO_ADDON_ID is not configured yet."
          echo "Create the add-on in AMO Developer Hub first, then set the variable and rerun the workflow."

      - name: Upload Firefox XPI to AMO for signing
        if: ${{ vars.AMO_ADDON_ID != '' }}
        continue-on-error: true
        env:
          MOZILLA_JWT_ISSUER: ${{ secrets.MOZILLA_JWT_ISSUER }}
          MOZILLA_JWT_SECRET: ${{ secrets.MOZILLA_JWT_SECRET }}
          AMO_ADDON_ID: ${{ vars.AMO_ADDON_ID }}
          AMO_API_BASE: https://addons.mozilla.org/api/v5
        run: |
          set -euo pipefail
          FILE="dist/komikhq-clipper-${TAG_NAME}-firefox.xpi"
          if [ ! -f "$FILE" ]; then
            echo "Missing Firefox XPI: $FILE"
            exit 1
          fi

          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const issuer = process.env.MOZILLA_JWT_ISSUER;
          const secret = process.env.MOZILLA_JWT_SECRET;

          if (!issuer || !secret) {
            throw new Error('Missing MOZILLA_JWT_ISSUER or MOZILLA_JWT_SECRET GitHub secrets.');
          }

          const b64url = (value) => Buffer.from(value).toString('base64url');
          const header = b64url(JSON.stringify({ alg: 'HS256', typ: 'JWT' }));
          const now = Math.floor(Date.now() / 1000);
          const payload = b64url(JSON.stringify({ iss: issuer, iat: now, exp: now + 300 }));
          const signature = crypto.createHmac('sha256', secret).update(`${header}.${payload}`).digest('base64url');
          fs.writeFileSync('/tmp/amo_jwt.txt', `${header}.${payload}.${signature}`);
          NODE

          JWT=$(cat /tmp/amo_jwt.txt)
          echo "Uploading Firefox XPI to AMO..."
          curl -sS -D /tmp/amo_upload_headers.txt \
            -H "Authorization: JWT ${JWT}" \
            -F "upload=@${FILE}" \
            -F "channel=unlisted" \
            "${AMO_API_BASE}/addons/${AMO_ADDON_ID}/versions/" \
            > /tmp/amo_upload_response.json

          echo "AMO upload response:"
          cat /tmp/amo_upload_response.json

          node <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync('/tmp/amo_upload_response.json', 'utf8');
          let data;
          try {
            data = JSON.parse(raw);
          } catch {
            console.error('AMO response is not valid JSON.');
            console.error(raw);
            process.exit(1);
          }

          const signedUrl = data.url || data.download_url || data.file || data.signed_url;
          if (!signedUrl) {
            console.error('No signed artifact URL found in AMO response.');
            console.error(JSON.stringify(data, null, 2));
            process.exit(1);
          }

          fs.writeFileSync('/tmp/amo_signed_url.txt', signedUrl);
          console.log('Signed URL discovered:', signedUrl);
          NODE

          SIGNED_URL=$(cat /tmp/amo_signed_url.txt)
          curl -L -sS \
            -H "Authorization: JWT ${JWT}" \
            "${SIGNED_URL}" \
            -o "dist/komikhq-clipper-${TAG_NAME}-firefox-signed.xpi"

          ls -lh "dist/komikhq-clipper-${TAG_NAME}-firefox-signed.xpi"

      - name: Generate AI Release Notes via Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node .github/scripts/generate_release_notes.js

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          draft: false
          if-no-files-found: ignore
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          files: |
            dist/komikhq-clipper-${{ env.TAG_NAME }}-chromium.zip
            dist/komikhq-clipper-${{ env.TAG_NAME }}.crx
            dist/komikhq-clipper-${{ env.TAG_NAME }}-firefox.xpi
            dist/komikhq-clipper-${{ env.TAG_NAME }}-firefox-signed.xpi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
