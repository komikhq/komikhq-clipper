name: Publish to Web Stores

on:
  workflow_run:
    workflows: ["Build & Release Extension Packs"]
    types:
      - completed
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to publish (e.g., v2.0.0)'
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.event.release.tag_name || github.event.workflow_run.head_branch }}

jobs:
  # --- Publish to Microsoft Edge Add-ons ---
  publish-edge:
    name: Publish to Edge Add-ons
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .output
          gh release download "${RELEASE_TAG}" -R "${{ github.repository }}" -p "*.zip" -D .output
          echo "Downloaded release zip packages:"
          ls -la .output/

      - name: Publish to Edge
        env:
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          pnpm tsx .github/scripts/publish-store/src/index.ts \
            --store edge \
            --zip ".output/komikhq-clipper-${RELEASE_TAG}-chrome.zip" \
            --version "$VERSION"

  # --- Publish to Mozilla Firefox AMO ---
  publish-firefox:
    name: Publish to Mozilla AMO
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .output
          gh release download "${RELEASE_TAG}" -R "${{ github.repository }}" -p "*.zip" -D .output
          echo "Downloaded release zip packages:"
          ls -la .output/

      - name: Publish to Firefox
        env:
          AMO_EXTENSION_ID: ${{ secrets.AMO_EXTENSION_ID }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          pnpm tsx .github/scripts/publish-store/src/index.ts \
            --store firefox \
            --zip-firefox ".output/komikhq-clipper-${RELEASE_TAG}-firefox.zip" \
            --version "$VERSION"
