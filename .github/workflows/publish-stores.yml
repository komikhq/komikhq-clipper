name: Publish to Web Stores

on:
  workflow_run:
    workflows: ["Build & Release Extension Packs"]
    types:
      - completed
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to publish (e.g., v2.0.0)'
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.event.release.tag_name || github.event.workflow_run.head_branch }}

jobs:
  # --- Stage 1: Build Extension Packages ---
  build:
    name: Build Extension Packages
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Extract Version from Tag
        id: version
        run: |
          VERSION="${RELEASE_TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Patch Package Version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.env.VERSION;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Typecheck
        run: pnpm compile

      - name: Build Chrome ZIP
        run: pnpm zip

      - name: Build Firefox ZIP
        run: pnpm zip:firefox

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-packages
          retention-days: 1
          path: |
            .output/*-chrome.zip
            .output/*-firefox.zip
            .output/*-sources.zip

  # --- Stage 2: Publish to Edge Add-ons ---
  publish-edge:
    name: Publish to Edge Add-ons
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: extension-packages
          path: .output

      - name: Publish to Edge
        env:
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          pnpm tsx .github/scripts/publish-store/src/index.ts \
            --store edge \
            --zip ".output/komikhq-clipper-${VERSION}-chrome.zip" \
            --version "$VERSION"

  # --- Stage 2: Publish to Mozilla AMO ---
  publish-firefox:
    name: Publish to Mozilla AMO
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: extension-packages
          path: .output

      - name: Publish to Firefox
        env:
          AMO_EXTENSION_ID: ${{ secrets.AMO_EXTENSION_ID }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          pnpm tsx .github/scripts/publish-store/src/index.ts \
            --store firefox \
            --zip-firefox ".output/komikhq-clipper-${VERSION}-firefox.zip" \
            --version "$VERSION"
